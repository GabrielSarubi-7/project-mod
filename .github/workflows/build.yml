name: Build Etheris

on:
  push:
    branches: [main, 'dev/**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build
        uses: gradle/actions/setup-gradle@v4
      - run: bash ./gradlew build runGameTestServer --no-daemon
      - name: Verify game tests actually ran
        run: grep -E 'All [1-9][0-9]* required tests passed' run-gametest/logs/latest.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: etheris-build-and-test-log
          path: |
            build/libs/*.jar
            run-gametest/logs/latest.log
