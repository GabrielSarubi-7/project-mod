name: Build Etheris

on:
  push:
    branches: [main, 'dev/**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build
        uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build --no-daemon
