plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.107'
}

version = project.mod_version
group = project.mod_group_id

repositories { maven { url = 'https://maven.neoforged.net/releases' } }

neoForge {
    version = project.neo_version
    parchment { minecraftVersion = '1.21.1'; mappingsVersion = '2024.11.17' }
    runs {
        client { client(); systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id }
        server { server(); programArgument '--nogui'; systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id }
        gameTestServer { type = 'gameTestServer' }
    }
    mods { "${project.mod_id}" { sourceSet sourceSets.main } }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

java { toolchain.languageVersion = JavaLanguageVersion.of(21) }

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
        neo_version: neo_version, neo_version_range: neo_version_range, loader_version_range: loader_version_range,
        mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
        mod_authors: mod_authors, mod_description: mod_description]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) { expand replaceProperties }
}
