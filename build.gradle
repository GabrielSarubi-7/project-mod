plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.107'
}

version = project.mod_version
group = project.mod_group_id

repositories {
    maven { url = 'https://maven.neoforged.net/releases' }
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroup('software.bernie.geckolib') }
    }
}

dependencies {
    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
}

neoForge {
    version = project.neo_version
    parchment { minecraftVersion = '1.21.1'; mappingsVersion = '2024.11.17' }
    runs {
        client { client(); systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id }
        server { server(); programArgument '--nogui'; systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id }
        gameTestServer { type = 'gameTestServer'; gameDirectory = project.file('run-gametest'); systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id }
    }
    mods { "${project.mod_id}" { sourceSet sourceSets.main } }
}

sourceSets.main.resources.srcDir 'src/generated/resources'
sourceSets.main.resources.srcDir layout.buildDirectory.dir('testTemplates')
tasks.register('generateTestTemplate') {
    def target = layout.buildDirectory.file('testTemplates/data/etheris/structure/empty.nbt')
    outputs.file(target)
    doLast {
        def file = target.get().asFile
        file.parentFile.mkdirs()
        new DataOutputStream(new java.util.zip.GZIPOutputStream(new FileOutputStream(file))).withCloseable { out ->
            out.writeByte(10); out.writeUTF('')
            out.writeByte(3); out.writeUTF('DataVersion'); out.writeInt(3955)
            out.writeByte(9); out.writeUTF('size'); out.writeByte(3); out.writeInt(3)
            [5, 5, 5].each { out.writeInt(it) }
            ['entities', 'blocks', 'palette'].each { name ->
                out.writeByte(9); out.writeUTF(name); out.writeByte(10); out.writeInt(0)
            }
            out.writeByte(0)
        }
    }
}
tasks.named('processResources') { dependsOn 'generateTestTemplate' }

java { toolchain.languageVersion = JavaLanguageVersion.of(21) }

tasks.register('checkAstraCloth', JavaExec) {
    dependsOn 'testClasses'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.etheris.animation.AstraClothMotionCheck'
}
tasks.named('check') { dependsOn 'checkAstraCloth' }

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
        neo_version: neo_version, neo_version_range: neo_version_range, loader_version_range: loader_version_range,
        mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
        mod_authors: mod_authors, mod_description: mod_description]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) { expand replaceProperties }
}
